services:
  - type: web
    name: nano-banana-alan
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: IMAGE_MODEL
        value: gemini-3.1-flash-image
      - key: IMAGE_MODEL_PRO
        value: gemini-3-pro-image
